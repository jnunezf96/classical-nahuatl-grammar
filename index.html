<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Classical Nahuatl Source, Grammar, and Result workbench backed by one canonical grammar engine."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="LL2yyM2UK6odSdrPJpP9-oPnpchig_vsaSKO-UAvV40" />
    <meta name="google-site-verification" content="JM-0cbhFodEemBNgTuA191-_JUoKW4JDu1rOD8Z6MEE" />
    <meta name="theme-color" content="#eef3ed" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20260813-diagram-annotations-179" />
    <script type="module" src="src/browser/main.mjs?v=20260813-diagram-annotations-179"></script>
    <title>Classical Nahuatl Grammar</title>
  </head>
  <body class="is-language-classical">
    <a class="skip-link" href="#classical-workbench">Skip to Source, Grammar, and Result</a>
    <main
      class="app-shell"
      id="classical-workbench"
      data-classical-workbench="true"
      data-classical-shell-authority="false"
      data-classical-grammar-authority="false"
      data-classical-presentation-only="true"
      aria-labelledby="app-title"
      tabindex="-1"
    >
      <header class="form-container-clause hero-panel hero-panel--entrada" id="container-header">
        <div class="hero-copy hero-copy--entrada">
          <p class="hero-eyebrow">Source · Grammar · Result</p>
          <h1 id="app-title">Classical Nahuatl Grammar</h1>
          <p class="hero-summary">
            Enter a typed Source, choose the applicable Grammar, and inspect the canonical Result.
          </p>
        </div>
        <div class="hero-controls">
          <button
            type="button"
            class="hero-help-button"
            id="classical-reader-guidance-toggle"
            aria-controls="classical-reader-guidance-dialog"
            aria-expanded="false"
          >
            Help
          </button>
          <div class="ui-density-control" role="group" aria-label="Presentation depth">
            <span class="ui-density-label" id="ui-density-label">Depth</span>
            <div class="ui-density-buttons">
              <button
                type="button"
                class="ui-density-button"
                id="ui-density-simple"
                data-ui-density="simple"
                aria-pressed="true"
                aria-description="Show the selected form and formula"
              >
                <span class="button-label">Study</span>
              </button>
              <button
                type="button"
                class="ui-density-button"
                id="ui-density-advanced"
                data-ui-density="advanced"
                aria-pressed="false"
                aria-description="Show structure, proof, and clause composition"
              >
                <span class="button-label">Analysis</span>
              </button>
            </div>
          </div>
        </div>
      </header>
      <dialog
        class="classical-reader-guidance-dialog"
        id="classical-reader-guidance-dialog"
        aria-labelledby="classical-reader-guidance-dialog-title"
      >
        <div class="classical-reader-guidance-dialog__header">
          <div>
            <p class="classical-reader-guidance-dialog__eyebrow">Workspace help</p>
            <h2 id="classical-reader-guidance-dialog-title">Help</h2>
          </div>
          <button
            type="button"
            class="classical-reader-guidance-dialog__close"
            id="classical-reader-guidance-close"
            aria-label="Close help"
          >
            Close
          </button>
        </div>
        <div class="classical-help-tabs" role="tablist" aria-label="Help sections">
          <button
            type="button"
            class="classical-help-tab is-active"
            id="classical-help-tab-reading"
            role="tab"
            aria-selected="true"
            aria-controls="classical-help-panel-reading"
            data-classical-help-tab="reading"
          >Reading guide</button>
          <button
            type="button"
            class="classical-help-tab"
            id="classical-help-tab-facts"
            role="tab"
            aria-selected="false"
            aria-controls="classical-help-panel-facts"
            data-classical-help-tab="facts"
            tabindex="-1"
          >Grammar facts</button>
        </div>
        <div class="classical-reader-guidance-dialog__content">
          <section
            class="classical-help-panel"
            id="classical-help-panel-reading"
            role="tabpanel"
            aria-labelledby="classical-help-tab-reading"
            data-classical-help-panel="reading"
          ></section>
          <section
            class="classical-help-panel"
            id="classical-help-panel-facts"
            role="tabpanel"
            aria-labelledby="classical-help-tab-facts"
            data-classical-help-panel="facts"
            hidden
          ></section>
        </div>
      </dialog>
      <div
        id="classical-app-root"
        data-classical-shell-root="true"
        data-classical-shell="source-authority-result"
        data-classical-nahuatl-tab-authority="andrews-transcription"
        data-classical-nahuatl-source-document="ANDREWS_TRANSCRIPTION_CANVAS.md"
        data-classical-nahuatl-orthography-policy="transcription-direct"
      >
        <div id="classical-source-panel" data-classical-panel-container="source"></div>
        <div id="classical-authority-panel" data-classical-panel-container="authority"></div>
        <div id="classical-result-panel" data-classical-panel-container="authorized-result"></div>
      </div>
      <div id="classical-footer-root" data-classical-shell-root="footer"></div>
    </main>
  </body>
</html>
