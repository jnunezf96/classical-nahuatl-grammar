<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Classical Nahuatl Source, Grammar, and Result workbench backed by one canonical grammar engine."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="LL2yyM2UK6odSdrPJpP9-oPnpchig_vsaSKO-UAvV40" />
    <meta name="google-site-verification" content="JM-0cbhFodEemBNgTuA191-_JUoKW4JDu1rOD8Z6MEE" />
    <meta name="theme-color" content="#eef3ed" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20260805-sgr-type-scale-166" />
    <script type="module" src="src/browser/main.mjs?v=20260810-exact-behavior-batch-001"></script>
    <title>Classical Nahuatl Grammar</title>
  </head>
  <body class="is-language-classical">
    <a class="skip-link" href="#classical-workbench">Skip to Source, Grammar, and Result</a>
    <main
      class="app-shell"
      id="classical-workbench"
      data-classical-workbench="true"
      data-classical-shell-authority="false"
      data-classical-grammar-authority="false"
      data-classical-presentation-only="true"
      aria-labelledby="app-title"
      tabindex="-1"
    >
      <header class="form-container-clause hero-panel hero-panel--entrada" id="container-header">
        <div class="hero-copy hero-copy--entrada">
          <p class="hero-eyebrow">Source · Grammar · Result</p>
          <h1 id="app-title">Classical Nahuatl Grammar</h1>
          <p class="hero-summary">
            Enter a typed Source, choose the applicable Grammar, and inspect the canonical Result.
          </p>
        </div>
        <div class="hero-controls">
          <div class="ui-scale-control">
            <label class="ui-scale-label" for="ui-scale">Interface size</label>
            <div class="ui-scale-row">
              <input
                type="range"
                id="ui-scale"
                min="-6"
                max="6"
                step="1"
                value="0"
                aria-label="Interface size"
              />
              <output class="ui-scale-value" id="ui-scale-value" for="ui-scale">0</output>
            </div>
          </div>
          <div class="ui-density-control" role="group" aria-label="Presentation depth">
            <span class="ui-density-label" id="ui-density-label">Depth</span>
            <div class="ui-density-buttons">
              <button
                type="button"
                class="ui-density-button button-with-icon"
                id="ui-density-simple"
                data-ui-density="simple"
                aria-pressed="true"
              >
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 16 16" focusable="false">
                    <rect x="3" y="3" width="10" height="10" rx="1.25"></rect>
                  </svg>
                </span>
                <span class="button-label">Study</span>
              </button>
              <button
                type="button"
                class="ui-density-button button-with-icon"
                id="ui-density-advanced"
                data-ui-density="advanced"
                aria-pressed="false"
              >
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 16 16" focusable="false">
                    <path d="M8 2.5 12.5 5v6L8 13.5 3.5 11V5z"></path>
                    <path d="M3.5 5 8 7.5 12.5 5"></path>
                    <path d="M8 7.5V13.5"></path>
                  </svg>
                </span>
                <span class="button-label">Analysis</span>
              </button>
            </div>
            <p class="ui-density-description" aria-live="polite">
              <span data-ui-density-description="simple">Selected form and formula</span>
              <span data-ui-density-description="advanced">Structure, proof, and clause composition</span>
            </p>
          </div>
        </div>
      </header>
      <div
        id="classical-app-root"
        data-classical-shell-root="true"
        data-classical-shell="source-authority-result"
        data-classical-nahuatl-tab-authority="andrews-transcription"
        data-classical-nahuatl-source-document="ANDREWS_TRANSCRIPTION_CANVAS.md"
        data-classical-nahuatl-orthography-policy="transcription-direct"
      >
        <div id="classical-source-panel" data-classical-panel-container="source"></div>
        <div id="classical-authority-panel" data-classical-panel-container="authority"></div>
        <div id="classical-result-panel" data-classical-panel-container="authorized-result"></div>
      </div>
      <div id="classical-footer-root" data-classical-shell-root="footer"></div>
    </main>
  </body>
</html>
