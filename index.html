    <style id="classical-loading-presentation">
      /* Critical first-paint styles: never expose the unfinished workbench. */
      #classical-workbench[aria-busy="true"] { visibility: hidden; }
      html:has(#classical-workbench[aria-busy="true"]) { overflow: hidden; }
      body.is-language-classical #classical-bootstrap-status {
        position: fixed; inset: 0; z-index: 1100;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; box-sizing: border-box;
        width: 100%; margin: 0; padding: 24px; border: 0; border-radius: 0;
        background: var(--workbench-paper, #fffdf5);
        color: var(--workbench-muted, #52645a);
        font: 400 15px/1.5 system-ui, sans-serif; text-align: center;
      }
      #classical-bootstrap-status .classical-bootstrap-title {
        color: var(--workbench-ink, #173e34); font-size: 22px; font-weight: 600;
      }
      #classical-bootstrap-status .classical-bootstrap-progress {
        display: flex; align-items: center; justify-content: center; gap: 10px;
      }
      :is(#classical-bootstrap-status,#classical-make-preview) .classical-bootstrap-spinner {
        width: 18px; height: 18px; flex: 0 0 18px; box-sizing: border-box;
        border: 2px solid #ccd7ce; border-top-color: #315f50;
        border-radius: 50%; animation: classical-bootstrap-spin 900ms linear infinite;
      }
      #classical-bootstrap-status.is-error .classical-bootstrap-spinner { display: none; }
      @keyframes classical-bootstrap-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        :is(#classical-bootstrap-status,#classical-make-preview) .classical-bootstrap-spinner { animation: none; }
      }
      body.is-language-classical #classical-bootstrap-status[hidden] { display: none; }
