name: Apply complete exact proof observations

on:
  pull_request:
    branches:
      - agent/consolidate-grammar-families
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/complete-exact-proof-observations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-exact-proof-observations
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and apply the reviewed exact-observation patch
        run: |
          cat \
            .github/complete-proof-migration/payload.00 \
            .github/complete-proof-migration/payload.01 \
            > /tmp/complete-proof.patch.gz.b64
          echo "ba27175deabc0df802d9652feeb0efb03175990550ee6cd9bafe65783e9aee69  /tmp/complete-proof.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/complete-proof.patch.gz.b64 > /tmp/complete-proof.patch.gz
          echo "1246b8a6e0f5bcb3bfbc1b1ebe8312f6848c95d8a6c4a4e2287de778959159f3  /tmp/complete-proof.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/complete-proof.patch.gz > /tmp/complete-proof.patch
          echo "6b566c9691fc884858a16b6aa80e83938daddf5446e8d8bbf4c38380e4465378  /tmp/complete-proof.patch" | sha256sum --check
          git apply --check /tmp/complete-proof.patch
          git apply /tmp/complete-proof.patch
          git diff --check

      - name: Check changed module syntax
        run: |
          node --check src/core/classical/routine_semantic_family_registry.mjs
          node --check src/core/classical/transcription_owner_mechanics.mjs
          node --check src/core/classical/transcription_owner_mechanics_legacy.mjs
          node --check src/core/grammar/canonical_identity_registry.mjs
          node --check src/core/grammar/canonical_proof_address_registry.mjs
          node --check src/tests/canonical_identity_registry.test.js
          node --check src/tests/canonical_semantic_witness_projection.test.js
          node --check src/tests/irregulars.test.js
          node --check src/tests/proof_precision_baseline.test.js
          node --check src/tests/routine_semantic_family_consolidation.test.js

      - name: Run complete exact-proof regression suites
        run: |
          cat > /tmp/run-complete-exact-proof-tests.mjs <<'NODE'
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          import { createRequire } from "node:module";

          const root = process.cwd();
          const require = createRequire(import.meta.url);
          const { createModuleRuntime } = await import(
            pathToFileURL(path.join(root, "src/node/runtime.mjs")).href
          );
          const tests = [
            "routine_semantic_family_consolidation.test.js",
            "proof_precision_baseline.test.js",
            "canonical_semantic_witness_projection.test.js",
            "nemi_preterit_agentive_exact_proof.test.js",
            "irregulars.test.js",
            "canonical_identity_registry.test.js",
            "classical_foundational_owner_identity.test.js",
            "concepts.test.js",
            "morpheme_structure_owners.test.js",
            "meaningful_morpheme_unit_classification.test.js",
            "meaningless_carrier_unit_classification.test.js",
            "carrier_rank_taxonomy.test.js",
            "morpheme_syllable_separation.test.js",
            "particles.test.js",
            "classical_sgr_orthography_surface.test.js",
            "classical_application_owner_identity.test.js",
            "grammar_operation.test.js",
            "module_runtime_integrity.test.js",
            "classical_lesson11_application_continuity.test.js",
            "classical_firewall.test.js",
            "classical_canonical_boundary_environment.test.js",
          ];
          let total = 0;
          let passed = 0;
          let failed = 0;
          for (const testFile of tests) {
            const { context } = await createModuleRuntime({
              rootDir: root,
              extraGlobals: { __TEST_RUNTIME_MODE__: "module" },
              exposeModuleInspectionCapabilities: true,
            });
            const testModule = require(path.join(root, "src/tests", testFile));
            const result = testModule.run(context).summarize();
            total += result.total;
            passed += result.passed;
            failed += result.failed;
          }
          console.log(
            `Complete exact-proof total: ${passed}/${total} passed across ${tests.length} suites`
          );
          if (failed || total !== 216 || passed !== 216) process.exit(1);
          NODE
          node /tmp/run-complete-exact-proof-tests.mjs

      - name: Remove one-use migration material and publish the verified result
        env:
          BRANCH: agent/complete-exact-proof-observations
        run: |
          rm -rf .github/complete-proof-migration
          rm -f .github/workflows/apply-complete-exact-proof-observations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace broad proof proxies with canonical witnesses"
          git push origin "HEAD:${BRANCH}"
