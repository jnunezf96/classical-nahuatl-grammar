name: Temporary exact-proof source snapshot

on:
  pull_request:
    branches:
      - agent/proof-precision-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive repository source
        run: git archive --format=tar.gz -o exact-proof-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: exact-proof-source
          path: exact-proof-source.tar.gz
          retention-days: 7
