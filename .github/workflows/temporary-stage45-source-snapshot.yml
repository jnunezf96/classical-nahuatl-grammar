name: Temporary stage 4-5 source snapshot

on:
  push:
    branches:
      - agent/nemi-preterit-agentive-exact-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nemi-preterit-agentive-exact-proof
      - name: Archive repository source
        run: git archive --format=tar.gz -o stage45-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: stage45-source
          path: stage45-source.tar.gz
          retention-days: 7
