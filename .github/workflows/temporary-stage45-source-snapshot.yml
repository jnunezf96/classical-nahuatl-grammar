name: Temporary stage 4-5 source snapshot

on:
  pull_request:
    branches:
      - agent/proof-precision-baseline
    types:
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/nemi-preterit-agentive-exact-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nemi-preterit-agentive-exact-proof
      - name: Archive repository source
        run: git archive --format=tar.gz -o stage45-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: stage45-source
          path: stage45-source.tar.gz
          retention-days: 7
