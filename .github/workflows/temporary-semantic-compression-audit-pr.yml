name: Temporary semantic compression audit PR bridge

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract and run the audit command
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temporary-semantic-compression-audit.yml').read_text().splitlines()
          marker = '      - name: Audit owners, proof precision, and coupling'
          start = source.index(marker)
          run_line = next(index for index in range(start + 1, len(source)) if source[index] == '        run: |')
          body = []
          for line in source[run_line + 1:]:
              if line.startswith('      - '):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/semantic-audit.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/semantic-audit.sh

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-compression-proof-precision-audit
          path: audit-output
          retention-days: 30
