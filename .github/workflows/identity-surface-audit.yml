name: Temporary identity surface audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit identity-bearing grammar surfaces
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, stat, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          async function walk(directory) {
            const output = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) output.push(...await walk(full));
              else output.push(full);
            }
            return output;
          }

          const allCoreFiles = (await walk("src/core"))
            .filter(file => /\.(?:mjs|js)$/u.test(file));
          const ownerSpecDirectories = [...new Set(allCoreFiles
            .map(file => path.dirname(file))
            .filter(directory => /owner-specs$/u.test(directory)))]
            .sort();

          const ownerSpecs = [];
          const importFailures = [];
          for (const directory of ownerSpecDirectories) {
            const files = (await readdir(directory))
              .filter(file => file.endsWith(".mjs"))
              .sort();
            for (const file of files) {
              const full = path.resolve(directory, file);
              try {
                const module = await import(pathToFileURL(full));
                const spec = module.default;
                if (spec && typeof spec === "object" && spec.ownerId) {
                  ownerSpecs.push({
                    file: path.relative(process.cwd(), full),
                    directory,
                    ownerId: spec.ownerId || "",
                    prefix: spec.prefix || "",
                    operationId: spec.operationId || "",
                    domain: spec.domain || "",
                    sourceKind: spec.sourceKind || "",
                    resultKind: spec.resultKind || "",
                    selections: Array.isArray(spec.selections) ? spec.selections : [],
                    coordinates: Object.entries(spec.coordinates || {}).map(
                      ([coordinateKey, coordinate]) => ({
                        coordinateKey,
                        assertionId: coordinate?.assertionId || "",
                        canonicalPath: coordinate?.canonicalPath || "",
                        proofAddressId: coordinate?.proofAddressId || "",
                        proofSemanticName: coordinate?.proofSemanticName || "",
                      }),
                    ),
                    analyses: Object.entries(spec.analyses || {}).map(
                      ([analysisKind, definition]) => ({
                        analysisKind,
                        checkpoint: definition?.checkpoint || "",
                        classification: definition?.classification || "",
                        relation: definition?.relation || "",
                      }),
                    ),
                  });
                }
              } catch (error) {
                importFailures.push({
                  file: path.relative(process.cwd(), full),
                  message: String(error?.message || error),
                });
              }
            }
          }

          const patterns = {
            ownerId: /\bownerId\s*:/gu,
            operationId: /\boperationId\s*:/gu,
            assertionId: /\bassertionId\s*:/gu,
            canonicalPath: /\bcanonicalPath\s*:/gu,
            coordinates: /\bcoordinates\s*:/gu,
            checkpoint: /\bcheckpoint\s*:/gu,
            sourceKind: /\bsourceKind\s*:/gu,
            resultKind: /\bresultKind\s*:/gu,
            stepId: /\bstepId\s*:/gu,
            branchId: /\bbranchId\s*:/gu,
            selectedRuleId: /\bselectedRuleId\s*:/gu,
            routeId: /\brouteId\s*:/gu,
          };
          const filePatternCounts = [];
          for (const file of allCoreFiles) {
            const source = await readFile(file, "utf8");
            const counts = {};
            for (const [name, pattern] of Object.entries(patterns)) {
              counts[name] = [...source.matchAll(pattern)].length;
            }
            if (Object.values(counts).some(Boolean)) {
              filePatternCounts.push({ file, ...counts });
            }
          }

          const ownerSpecFiles = new Set(ownerSpecs.map(spec => spec.file));
          const bespokeIdentityFiles = filePatternCounts
            .filter(record => !ownerSpecFiles.has(record.file))
            .filter(record => (
              record.ownerId
              || record.operationId
              || record.coordinates
              || record.checkpoint
              || record.sourceKind
              || record.resultKind
              || record.stepId
              || record.branchId
            ));

          const summary = {
            ownerSpecDirectories,
            ownerSpecDirectoryCounts: Object.fromEntries(ownerSpecDirectories.map(
              directory => [directory, ownerSpecs.filter(spec => spec.directory === directory).length],
            )),
            ownerSpecCount: ownerSpecs.length,
            ownerCoordinateCount: ownerSpecs.reduce(
              (count, spec) => count + spec.coordinates.length,
              0,
            ),
            ownerAnalysisCount: ownerSpecs.reduce(
              (count, spec) => count + spec.analyses.length,
              0,
            ),
            ownerSpecs,
            importFailures,
            bespokeIdentityFiles,
            patternTotals: Object.fromEntries(Object.keys(patterns).map(name => [
              name,
              filePatternCounts.reduce((sum, record) => sum + record[name], 0),
            ])),
          };
          await writeFile("identity-surface-audit.json", JSON.stringify(summary, null, 2));
          console.log(JSON.stringify({
            ownerSpecDirectories: summary.ownerSpecDirectoryCounts,
            ownerSpecCount: summary.ownerSpecCount,
            ownerCoordinateCount: summary.ownerCoordinateCount,
            ownerAnalysisCount: summary.ownerAnalysisCount,
            importFailureCount: importFailures.length,
            bespokeIdentityFileCount: bespokeIdentityFiles.length,
            patternTotals: summary.patternTotals,
            topBespokeFiles: bespokeIdentityFiles
              .sort((a, b) => (
                b.ownerId + b.operationId + b.checkpoint + b.stepId + b.branchId
                - (a.ownerId + a.operationId + a.checkpoint + a.stepId + a.branchId)
              ))
              .slice(0, 40),
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: identity-surface-audit
          path: identity-surface-audit.json
