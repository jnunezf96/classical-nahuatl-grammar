name: Apply universal permanent identity migration

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/migrate-proof-addresses'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-proof-addresses
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and apply the reviewed migration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          directory = Path('.github/identity-migration')
          head = (directory / 'patch.00').read_text()
          for index in (6048, 6684, 6788, 7392):
              head = head[:index] + 'I' + head[index:]
          if len(head) != 10000:
              raise SystemExit(f'unexpected-repaired-head-length:{len(head)}')
          payload = ''.join([
              head,
              (directory / 'patch.01').read_text()[3000:],
              (directory / 'patch.02').read_text(),
              (directory / 'patch.03').read_text(),
          ])
          Path('/tmp/universal-identity.patch.b64').write_text(payload)
          PY
          echo "4a4488d4c33e73e9c25b4e315ae690b4130ce44b636b8e5c17869a678fb84c39  /tmp/universal-identity.patch.b64" | sha256sum --check
          base64 --decode /tmp/universal-identity.patch.b64 > /tmp/universal-identity.patch
          echo "fec27399cb896a3f64e6bf94c15c8131a44d3943c896059daa8e23e5720de4b6  /tmp/universal-identity.patch" | sha256sum --check
          git apply --check /tmp/universal-identity.patch
          git apply /tmp/universal-identity.patch
          git diff --check

      - name: Check changed module syntax
        run: |
          node --check src/core/grammar/canonical_identity_registry.mjs
          node --check src/core/grammar/operation_owner.mjs
          node --check src/core/grammar/contract_registry.mjs
          node --check src/core/classical/transcription_owner_mechanics.mjs
          node --check src/core/concepts/foundational_owner_mechanics.mjs
          node --check src/core/concepts/carrier_structure_owner_mechanics.mjs
          node --check src/core/concepts/morpheme_structure_owners.mjs
          node --check src/core/concepts/linguistic_structure_owners.mjs
          node --check src/tests/canonical_identity_registry.test.js
          node --check src/tests/irregulars.test.js

      - name: Run focused identity and grammar checks
        run: |
          cat > /tmp/run-focused-tests.mjs <<'NODE'
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          import { createRequire } from "node:module";

          const root = process.cwd();
          const require = createRequire(import.meta.url);
          const { createModuleRuntime } = await import(
            pathToFileURL(path.join(root, "src/node/runtime.mjs")).href
          );
          const tests = [
            "canonical_identity_registry.test.js",
            "irregulars.test.js",
            "classical_foundational_owner_identity.test.js",
            "concepts.test.js",
            "morpheme_structure_owners.test.js",
            "carrier_rank_taxonomy.test.js",
            "classical_application_owner_identity.test.js",
            "grammar_operation.test.js",
            "module_runtime_integrity.test.js",
          ];
          let total = 0;
          let passed = 0;
          let failed = 0;
          for (const testFile of tests) {
            const { context } = await createModuleRuntime({
              rootDir: root,
              extraGlobals: { __TEST_RUNTIME_MODE__: "module" },
              exposeModuleInspectionCapabilities: true,
            });
            const testModule = require(
              path.join(root, "src/tests", testFile)
            );
            const result = testModule.run(context).summarize();
            total += result.total;
            passed += result.passed;
            failed += result.failed;
          }
          console.log(
            `Focused total: ${passed}/${total} passed across ${tests.length} suites`
          );
          if (failed) process.exit(1);
          NODE
          node /tmp/run-focused-tests.mjs

      - name: Remove one-use migration material and publish the result
        env:
          BRANCH: agent/migrate-proof-addresses
        run: |
          rm -rf .github/identity-migration
          rm -f .github/workflows/apply-universal-identity-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extend permanent identities across all grammar systems"
          git push origin "HEAD:${BRANCH}"
