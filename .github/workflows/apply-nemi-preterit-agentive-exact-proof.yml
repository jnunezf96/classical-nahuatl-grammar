name: Apply nemi preterit-agentive exact proof

on:
  pull_request:
    branches:
      - agent/proof-precision-baseline
    types:
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/nemi-preterit-agentive-exact-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nemi-preterit-agentive-exact-proof
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and apply the reviewed exact-proof patch
        run: |
          cat .github/exact-proof-migration/patch.* > /tmp/exact-proof.patch.b64
          echo "6e7a6e9af998fad45f11057ecb846799427175292254416d7f33bf16a29128a0  /tmp/exact-proof.patch.b64" | sha256sum --check
          base64 --decode /tmp/exact-proof.patch.b64 > /tmp/exact-proof.patch
          echo "af252230d46faaf609720f32ab534675d7545537bd0b3385258c5d3e4ba7b786  /tmp/exact-proof.patch" | sha256sum --check
          git apply --check /tmp/exact-proof.patch
          git apply /tmp/exact-proof.patch
          git diff --check

      - name: Check changed module syntax
        run: |
          node --check src/core/classical/deverbal_nnc_validation_semantic_operations.mjs
          node --check src/core/classical/nnc_lessons35_39_closure.mjs
          node --check src/core/classical/nuclear-owner-specs/classical-nemi-irregular-paradigm.mjs
          node --check src/core/classical/nuclear-owner-specs/classical-predicate-nominalization-preterit-agentive.mjs
          node --check src/core/classical/vnc_lessons9_11_semantic_operations.mjs
          node --check src/core/grammar/canonical_proof_address_registry.mjs
          node --check src/tests/canonical_identity_registry.test.js
          node --check src/tests/irregulars.test.js
          node --check src/tests/nemi_preterit_agentive_exact_proof.test.js
          node --check src/tests/proof_precision_baseline.test.js

      - name: Run exact-proof and regression suites
        run: |
          cat > /tmp/run-exact-proof-tests.mjs <<'NODE'
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          import { createRequire } from "node:module";

          const root = process.cwd();
          const require = createRequire(import.meta.url);
          const { createModuleRuntime } = await import(
            pathToFileURL(path.join(root, "src/node/runtime.mjs")).href
          );
          const tests = [
            "proof_precision_baseline.test.js",
            "irregulars.test.js",
            "nemi_preterit_agentive_exact_proof.test.js",
            "canonical_identity_registry.test.js",
            "module_runtime_integrity.test.js",
            "classical_lesson11_application_continuity.test.js",
            "classical_firewall.test.js",
            "classical_canonical_boundary_environment.test.js",
          ];
          let total = 0;
          let passed = 0;
          let failed = 0;
          for (const testFile of tests) {
            const { context } = await createModuleRuntime({
              rootDir: root,
              extraGlobals: { __TEST_RUNTIME_MODE__: "module" },
              exposeModuleInspectionCapabilities: true,
            });
            const testModule = require(path.join(root, "src/tests", testFile));
            const result = testModule.run(context).summarize();
            total += result.total;
            passed += result.passed;
            failed += result.failed;
          }
          console.log(
            `Exact-proof total: ${passed}/${total} passed across ${tests.length} suites`
          );
          if (failed) process.exit(1);
          NODE
          node /tmp/run-exact-proof-tests.mjs

      - name: Remove one-use migration material and publish the verified result
        env:
          BRANCH: agent/nemi-preterit-agentive-exact-proof
        run: |
          rm -rf .github/exact-proof-migration
          rm -f .github/workflows/apply-nemi-preterit-agentive-exact-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prove nemi preterit-agentive through exact Results"
          git push origin "HEAD:${BRANCH}"
