name: Temporary complete-proof source snapshot

on:
  pull_request:
    branches:
      - agent/consolidate-grammar-families
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/complete-exact-proof-observations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-exact-proof-observations
      - name: Archive repository source
        run: git archive --format=tar.gz -o complete-proof-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: complete-proof-source
          path: complete-proof-source.tar.gz
          retention-days: 7
